# Linux 운영 서버에 배포되는 예시이며 번들 생성 시 LF 줄바꿈으로 정규화된다.
mattermost:
  url: "http://mattermost.internal.example"
  token: "CHANGE_ME"
  verify_ssl: true
  request_timeout_seconds: 10
  immediate_retry_attempts: 3
  retry_base_seconds: 1
  retry_max_seconds: 300
  retry_jitter_ratio: 0.2

obsidian_notifications:
  # vault_path는 notifier 컨테이너 내부 경로이다. 호스트의
  # /data/obsidian-mattermost-notifier/vaults가 /srv/obsidian/vaults로 마운트된다.
  - enabled: true
    vault_path: "/srv/obsidian/vaults/example_vault"
    vault_name: "example_vault"
    team_name: "dev-team"
    channel_name: "development-docs"
    ignore_folders:
      - ".obsidian"
      - ".trash"
    settle_seconds: 2

  - enabled: false
    vault_path: "/srv/obsidian/vaults/another_vault"
    vault_name: "another_vault"
    team_name: "dev-team"
    channel_name: "another-docs"
    ignore_folders:
      - ".obsidian"
      - ".trash"
    settle_seconds: 2

state:
  # 컨테이너 내부 경로이다. 호스트에서는
  # /data/obsidian-mattermost-notifier/state/notifier/notifier.db에 저장된다.
  database_path: "/var/lib/obsidian-mattermost-notifier/notifier.db"

logging:
  level: "INFO"
