name: obsidian-mattermost-notifier

services:
  livesync-bridge:
    image: "${LIVESYNC_BRIDGE_IMAGE:?Set LIVESYNC_BRIDGE_IMAGE in .env}"
    pull_policy: never
    restart: unless-stopped
    group_add:
      - "20001"
    environment:
      DENO_DIR: /var/lib/livesync-bridge/deno
      LSB_CONFIG: /run/secrets/livesync-bridge-config.json
      LSB_HEALTH_FILE: /tmp/livesync-bridge-health.json
      TZ: Asia/Seoul
    volumes:
      # 왼쪽은 운영 서버 경로, 오른쪽은 컨테이너 내부 경로이다.
      - /data/obsidian-mattermost-notifier/config/livesync-bridge/config.json:/run/secrets/livesync-bridge-config.json:ro,Z
      - /etc/localtime:/etc/localtime:ro
      - /data/obsidian-mattermost-notifier/vaults:/app/data:rw,z
      - /data/obsidian-mattermost-notifier/state/livesync-bridge:/var/lib/livesync-bridge:rw,Z
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const h=JSON.parse(await Deno.readTextFile('/tmp/livesync-bridge-health.json')); if (!Number.isFinite(h.ts) || h.restartWorthy === true || Date.now() - h.ts > 30000) Deno.exit(1);"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_grace_period: 30s

  obsidian-mattermost-notifier:
    image: "${NOTIFIER_IMAGE:?Set NOTIFIER_IMAGE in .env}"
    pull_policy: never
    init: true
    restart: unless-stopped
    group_add:
      - "20001"
    depends_on:
      livesync-bridge:
        condition: service_healthy
    environment:
      NOTIFIER_READINESS_FILE: /var/lib/obsidian-mattermost-notifier/bridge-initial-sync.complete
      TZ: Asia/Seoul
    volumes:
      # 왼쪽은 운영 서버 경로, 오른쪽은 컨테이너 내부 경로이다.
      - /data/obsidian-mattermost-notifier/config/notifier/config.yaml:/etc/obsidian-mattermost-notifier/config.yaml:ro,Z
      - /etc/localtime:/etc/localtime:ro
      - /data/obsidian-mattermost-notifier/vaults:/srv/obsidian/vaults:ro,z
      - /data/obsidian-mattermost-notifier/state/notifier:/var/lib/obsidian-mattermost-notifier:rw,Z
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /var/lib/obsidian-mattermost-notifier/bridge-initial-sync.complete && kill -0 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
